# Optional local services. Not required for development (SQLite is the default).
#
# PostgreSQL (optional production-like database):
#   docker compose --env-file .env.production --profile postgres up -d
#
# Images use exact version tags (never "latest").
name: helper-abi

services:
  postgres:
    image: postgres:18.6-alpine3.24
    profiles: ['postgres']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:-helper_abi}
    ports:
      # Bound to localhost only.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
